schema: "1.0"
mode: "hybrid"
language: "es"
language_rules:
  artifacts: "es"
  chat: "es"
context: |
  Ludist / Ludeca — "El Letterboxd de los juegos de mesa en español".
  Arquitectura: .NET 10 (C# 13), Blazor Web App (SSR + Interactivo), Clean Architecture / Vertical Slices.
  Memoria persistente: Engram MCP. UI: Tailwind CSS + componentes propios/Lucide Icons.
  IDIOMA OBLIGATORIO: Todos los artefactos de SDD, propuestas, especificaciones, tareas y comunicaciones deben estar redactados en español (castellano).
strict_tdd: true
testing:
  workspace_command: "dotnet test src/Ludeca.slnx"
  framework: "xUnit (.NET 10)"
projects:
  - path: "src/Ludeca.Web"
    stack: ".NET 10 Blazor Web App"
    test_command: "dotnet test src/Ludeca.slnx"
  - path: "src/Ludeca.Core"
    stack: ".NET 10 Class Library"
    test_command: "dotnet test src/Ludeca.slnx"
  - path: "src/Ludeca.Application"
    stack: ".NET 10 Class Library"
    test_command: "dotnet test src/Ludeca.slnx"
  - path: "src/Ludeca.Infrastructure"
    stack: ".NET 10 Class Library"
    test_command: "dotnet test src/Ludeca.slnx"
  - path: "tests/Ludeca.UnitTests"
    stack: ".NET 10 xUnit"
    test_command: "dotnet test tests/Ludeca.UnitTests/Ludeca.UnitTests.csproj"
