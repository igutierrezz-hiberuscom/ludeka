# =====================================================================
# Ludeka - Configuración de Servidor Virtual Nginx con soporte SignalR
# =====================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream ludeka_upstream {
    server ludeka-web:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name ludeka.es www.ludeka.es localhost;

    # Ruta para validación de certificados SSL con Certbot / Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Descomentar la siguiente línea tras emitir el certificado SSL:
    # return 301 https://$host$request_uri;

    # Enrutamiento hacia Blazor Web App
    location / {
        proxy_pass http://ludeka_upstream;
        proxy_http_version 1.1;

        # Cabeceras requeridas para WebSockets en Blazor Server (SignalR)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Desactivar buffering para comunicación reactiva sin latencia
        proxy_buffering off;
        proxy_read_timeout 100s;
        proxy_send_timeout 100s;

        # Cabeceras de Seguridad Estrictas
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}

