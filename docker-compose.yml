services:
  ludeka-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ludeka-web
    restart: unless-stopped
    ports:
      - "${PORT:-5081}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/ludeka.db
    env_file:
      - path: .env
        required: false
    volumes:
      - ludeka_data:/app/data
      - ludeka_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - ludeka-network

volumes:
  ludeka_data:
    name: ludeka_data
  ludeka_logs:
    name: ludeka_logs

networks:
  ludeka-network:
    name: ludeka_network
    driver: bridge
