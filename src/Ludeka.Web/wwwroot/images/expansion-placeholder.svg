<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGradExp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0C1B"/>
      <stop offset="100%" stop-color="#1A142E"/>
    </linearGradient>
    <linearGradient id="cardGradExp" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241B3E"/>
      <stop offset="100%" stop-color="#150F26"/>
    </linearGradient>
    <linearGradient id="puzzleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>
  </defs>

  <!-- Fondo base -->
  <rect width="400" height="400" fill="url(#bgGradExp)"/>

  <!-- Glow ambiental violeta -->
  <circle cx="200" cy="190" r="110" fill="#9333EA" opacity="0.12"/>

  <!-- Tarjeta interior con bisel -->
  <rect x="24" y="24" width="352" height="352" rx="20" fill="url(#cardGradExp)" stroke="#4C1D95" stroke-width="2"/>

  <!-- Cabecera de Marca: Logotipo Ludeka -->
  <g transform="translate(200, 68)">
    <text text-anchor="middle" fill="#FFFFFF" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" letter-spacing="-0.5">
      Ludeka<tspan fill="#C084FC">.</tspan>
    </text>
    <text y="18" text-anchor="middle" fill="#A78BFA" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="700" letter-spacing="1.5">
      EXPANSIÓN OFICIAL
    </text>
  </g>

  <!-- Isotipo central: Pieza de Puzzle / Módulo de Expansión -->
  <g transform="translate(200, 185)">
    <!-- Círculo de fondo del icono -->
    <circle cx="0" cy="0" r="54" fill="#130D24" stroke="#4C1D95" stroke-width="1.5"/>

    <!-- Pieza de Puzzle 🧩 estilizada -->
    <g transform="translate(-24, -28)">
      <!-- Forma vectorial limpia de pieza de puzzle -->
      <path d="M 6 6 
               H 20 
               C 20 0, 28 0, 28 6 
               H 42 
               V 20 
               C 48 20, 48 28, 42 28 
               V 42 
               H 28 
               C 28 36, 20 36, 20 42 
               H 6 
               V 28 
               C 12 28, 12 20, 6 20 
               Z" 
            fill="url(#puzzleGrad)" 
            stroke="#E9D5FF" 
            stroke-width="2" 
            stroke-linejoin="round"
            transform="scale(1.15)"/>
      
      <!-- Detalle lúdico interior: mini dado acoplado -->
      <circle cx="28" cy="28" r="4.5" fill="#FFFFFF" opacity="0.9"/>
      <circle cx="20" cy="20" r="2.5" fill="#FAF5FF" opacity="0.8"/>
      <circle cx="36" cy="36" r="2.5" fill="#FAF5FF" opacity="0.8"/>
    </g>
  </g>

  <!-- Badge distintivo: Expansión -->
  <g transform="translate(200, 282)">
    <rect x="-80" y="-15" width="160" height="30" rx="15" fill="#3B0764" stroke="#C084FC" stroke-width="1.5"/>
    <text text-anchor="middle" y="5" fill="#F3E8FF" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="800" letter-spacing="0.5">
      🧩 EXPANSIÓN
    </text>
  </g>

  <!-- Pie de placeholder -->
  <text x="200" y="336" text-anchor="middle" fill="#A78BFA" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600">
    Requiere juego base para jugar
  </text>
</svg>
