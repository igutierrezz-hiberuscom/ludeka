<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sin Conexión — Ludeka</title>
    <meta name="theme-color" content="#d97706" />
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #18181b;
            color: #f4f4f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            text-align: center;
        }
        .card {
            background-color: #27272a;
            border: 1px solid #3f3f46;
            border-radius: 1.5rem;
            max-width: 480px;
            width: 100%;
            padding: 2.5rem 2rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
        }
        .icon-badge {
            width: 5rem;
            height: 5rem;
            margin: 0 auto 1.5rem;
            border-radius: 1.25rem;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            box-shadow: 0 10px 15px -3px rgba(217, 119, 6, 0.3);
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.025em;
            margin-bottom: 0.75rem;
            color: #ffffff;
        }
        p {
            font-size: 0.875rem;
            line-height: 1.5;
            color: #a1a1aa;
            margin-bottom: 1.75rem;
        }
        .highlight {
            color: #fbbf24;
            font-weight: 600;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.75rem 1.25rem;
            border-radius: 0.75rem;
            font-size: 0.875rem;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.2s ease;
            cursor: pointer;
            border: none;
        }
        .btn-primary {
            background-color: #d97706;
            color: #ffffff;
        }
        .btn-primary:hover {
            background-color: #b45309;
        }
        .btn-secondary {
            background-color: #3f3f46;
            color: #f4f4f5;
            border: 1px solid #52525b;
        }
        .btn-secondary:hover {
            background-color: #52525b;
        }
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.375rem;
            font-size: 0.75rem;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            background-color: rgba(245, 158, 11, 0.15);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.3);
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="card" role="main">
        <div class="icon-badge" aria-hidden="true">🎲</div>
        <div class="status-pill">
            <span>📡</span>
            <span>Modo sin conexión</span>
        </div>
        <h1>Estás fuera de cobertura</h1>
        <p>
            No hemos podido conectar con los servidores de <strong style="color:#ffffff">Ludeka</strong>.
            Si ya visitaste tu <span class="highlight">Ludoteca Personal</span>, puedes seguir consultando tus títulos y préstamos guardados en este dispositivo.
        </p>
        <div class="btn-group">
            <button type="button" onclick="window.location.reload();" class="btn btn-primary">
                <span>🔄</span>
                <span>Reintentar conexión</span>
            </button>
            <a href="/mi-ludoteca" class="btn btn-secondary">
                <span>📚</span>
                <span>Abrir Mi Ludoteca Offline</span>
            </a>
            <a href="/" class="btn btn-secondary" style="font-size:0.8rem; background:transparent; border-color:transparent; color:#a1a1aa;">
                <span>🏠</span>
                <span>Volver al inicio</span>
            </a>
        </div>
    </div>
</body>
</html>
